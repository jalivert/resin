name: Haskell CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: [ "9.10", "9.12" ]

    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "latest"

      - name: Install alex and happy
        run: |
          ghcup install alex
          ghcup install happy 1.20.1.1

      - run: cabal update

      - name: Build all components
        run: cabal build all --enable-tests

      - name: Run test suite
        run: cabal test all
